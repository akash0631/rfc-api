name: Probe cloudflared topology
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, iis]
    steps:
      - name: List tunnels + dns routes + ingress live
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $cf = "$env:ProgramFiles\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            $cf = (Get-WmiObject -Class Win32_Service -Filter "Name='cloudflared'" -ErrorAction SilentlyContinue).PathName -replace '^"','' -replace '".*$',''
            Write-Host "Resolved cf binary: $cf"
          }
          Write-Host "=== Tunnel list (account-scoped) ==="
          & $cf tunnel list 2>&1
          Write-Host ""
          Write-Host "=== sap-odata DNS resolution ==="
          Resolve-DnsName sap-odata.v2retail.net -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Resolve-DnsName sap-odata-qa.v2retail.net -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host ""
          Write-Host "=== Tunnel 39698895 info ==="
          & $cf tunnel info 39698895-8ceb-489d-8d5a-315292111aab 2>&1
          Write-Host ""
          Write-Host "=== Tunnel 39698895 ingress rules (live remote config) ==="
          & $cf tunnel ingress url 'https://sap-odata-qa.v2retail.net/sap/bc/adt/discovery' 2>&1
          Write-Host ""
          Write-Host "=== Check from local — direct backend ==="
          try {
            $r = Invoke-WebRequest 'http://192.168.144.179:8000/sap/bc/adt/discovery?sap-client=600' `
              -Headers @{Authorization=('Basic '+[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('sap_cloudai:Cloud@0905')))} `
              -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
            Write-Host ".179 direct ADT: $($r.StatusCode) $($r.Headers['Content-Type']) bytes=$($r.RawContentLength)"
          } catch { Write-Host ".179 direct ADT err: $_" }
          try {
            $r = Invoke-WebRequest 'http://192.168.144.179:8000/sap/opu/odata/sap/Z_SB_ARTICLE/ArtMin/%24count?sap-client=600' `
              -Headers @{Authorization=('Basic '+[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('sap_cloudai:Cloud@0905')))} `
              -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop
            Write-Host ".179 direct OData: $($r.StatusCode) body=$($r.Content.Substring(0,[Math]::Min(100,$r.Content.Length)))"
          } catch { Write-Host ".179 direct OData err: $_" }
