name: Probe cloudflared topology
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, iis]
    steps:
      - name: List tunnels + dns + direct backends
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $cf = "$env:ProgramFiles\cloudflared\cloudflared.exe"
          if (-not (Test-Path $cf)) { $cf = (Get-WmiObject -Class Win32_Service -Filter "Name='cloudflared'" -ErrorAction SilentlyContinue).PathName -replace '^"','' -replace '".*$',''; Write-Host "cf binary: $cf" }
          Write-Host "=== Tunnel list ==="
          & $cf tunnel list 2>&1
          Write-Host "=== DNS resolution ==="
          Resolve-DnsName sap-odata.v2retail.net -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Resolve-DnsName sap-odata-qa.v2retail.net -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "=== Tunnel 39698895 info ==="
          & $cf tunnel info 39698895-8ceb-489d-8d5a-315292111aab 2>&1
          Write-Host "=== Tunnel ingress test for QA ADT URL ==="
          & $cf tunnel ingress url 'https://sap-odata-qa.v2retail.net/sap/bc/adt/discovery' 2>&1
          Write-Host "=== .174 direct ADT (control) ==="
          $h = @{Authorization=('Basic '+[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('sap_cloudai:Cloud@0905')))}
          try { $r = Invoke-WebRequest 'http://192.168.144.174:8000/sap/bc/adt/discovery?sap-client=210' -Headers $h -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop; Write-Host (".174 ADT: " + $r.StatusCode + " bytes=" + $r.RawContentLength) } catch { Write-Host (".174 ADT err: " + $_.Exception.Message) }
          Write-Host "=== .179 direct ADT ==="
          try { $r = Invoke-WebRequest 'http://192.168.144.179:8000/sap/bc/adt/discovery?sap-client=600' -Headers $h -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop; Write-Host (".179 ADT: " + $r.StatusCode + " bytes=" + $r.RawContentLength) } catch { Write-Host (".179 ADT err: " + $_.Exception.Message) }
          Write-Host "=== .179 direct OData (control) ==="
          $u = 'http://192.168.144.179:8000/sap/opu/odata/sap/Z_SB_ARTICLE/ArtMin/%24count?sap-client=600'
          try { $r = Invoke-WebRequest $u -Headers $h -UseBasicParsing -TimeoutSec 15 -ErrorAction Stop; Write-Host (".179 OData: " + $r.StatusCode + " body=" + $r.Content) } catch { Write-Host (".179 OData err: " + $_.Exception.Message) }
