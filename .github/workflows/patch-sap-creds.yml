name: Patch SAP creds (one-shot)

on:
  workflow_dispatch:
    inputs:
      sap_user:
        description: 'SAP user to set in Web.config'
        required: true
        default: 'sap_cloudai'
      sap_pass:
        description: 'SAP password (will be masked in log)'
        required: true
        default: 'Cloud@0905'

jobs:
  patch:
    runs-on: [self-hosted, iis]
    steps:
      - name: Mask password
        shell: powershell
        run: |
          $p = '${{ github.event.inputs.sap_pass }}'
          Write-Host "::add-mask::$p"

      - name: Patch Web.config sap_abap block
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wc = 'C:\V2RfcTest\Web.config'
          if (-not (Test-Path $wc)) { throw "Web.config not found at $wc" }
          $c = Get-Content $wc -Raw
          $newUser = '${{ github.event.inputs.sap_user }}'
          $newPass = '${{ github.event.inputs.sap_pass }}'
          # Patch the sap_abap / Hana@123456 block (the active one for RFC proxy)
          $c = $c -replace '("User"\s+value=")sap_abap(")', "`$1$newUser`$2"
          $c = $c -replace '("Password"\s+value=")Hana@123456(")', "`$1$newPass`$2"
          Set-Content $wc $c -Encoding UTF8
          Write-Host "Web.config patched. Current user line:"
          (Get-Content $wc) | Select-String 'sap_cloudai|sap_abap' | ForEach-Object { $_.Line }

      - name: Recycle V2RfcTestPool
        shell: powershell
        run: |
          & C:\Windows\System32\inetsrv\appcmd.exe recycle apppool /apppool.name:V2RfcTestPool
          Start-Sleep 8
          Write-Host "App pool recycled."

      - name: Smoke RFC proxy
        shell: powershell
        run: |
          try {
            $r = Invoke-WebRequest 'http://localhost:9292/api/rfc/proxy' `
                -Method POST `
                -Body '{"bapiname":"RFC_PING"}' `
                -ContentType 'application/json' `
                -Headers @{'X-RFC-Key'='v2-rfc-proxy-2026'} `
                -UseBasicParsing -TimeoutSec 20
            Write-Host "RFC proxy OK: $($r.Content.Substring(0,[Math]::Min(300,$r.Content.Length)))"
          } catch {
            Write-Host "RFC smoke result: $_"
          }
          exit 0
