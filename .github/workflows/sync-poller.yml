name: SAP sync poller (runs SYNC_REQUEST)

# Every 10 min: read PENDING rows from V2RETAIL.BRONZE.SYNC_REQUEST (written by the Streamlit
# "Run" tab), dispatch the incremental-sync workflow for each, mark DISPATCHED. Needs a PAT
# secret GH_PAT (fine-grained, Actions: read/write on akash0631/rfc-api) to trigger the other
# workflow (the default GITHUB_TOKEN can't). Without GH_PAT, requests are marked ERROR (visible in UI).
#
# NOTE: the runner runs as a Windows service, whose account PATH may not include a per-user
# Python. The "Resolve Python" step below finds python.exe explicitly so steps don't depend on PATH.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: [self-hosted, iis]
    steps:
      - name: Resolve Python
        shell: powershell
        run: |
          $py = (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if (-not $py) { $py = (Get-Command py.exe -ErrorAction SilentlyContinue).Source }
          if (-not $py) {
            $cands = @()
            $cands += Get-ChildItem 'C:\Python*\python.exe','C:\Program Files\Python*\python.exe','C:\Program Files (x86)\Python*\python.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName
            $cands += Get-ChildItem 'C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue | ForEach-Object FullName
            $py = $cands | Where-Object { $_ } | Select-Object -First 1
          }
          if (-not $py) { Write-Error 'Python not found on runner. Fix: install Python + add to SYSTEM PATH, or run the runner service under an account that has python.'; exit 1 }
          Write-Host "Using python: $py"
          "PYEXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Deps
        shell: powershell
        run: |
          # Only hit PyPI if the module is missing (it is pre-installed on the runner).
          # A plain --upgrade reached PyPI every run and hung to the 10-min timeout when
          # the runner's outbound was slow -> flaky red poller runs. Skip when importable.
          & "$env:PYEXE" -c "import snowflake.connector" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "installing snowflake-connector-python"
            & "$env:PYEXE" -m pip install --quiet --disable-pip-version-check --timeout 30 --retries 2 snowflake-connector-python
          } else { Write-Host "snowflake-connector present; skipping pip" }
      - name: Process pending requests
        shell: powershell
        env:
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          GH_PAT:      ${{ secrets.GH_PAT }}
        run: |
          $src = @'
          import os, subprocess, snowflake.connector
          con=snowflake.connector.connect(account=os.environ["SF_ACCOUNT"],user=os.environ["SF_USER"],password=os.environ["SF_PASSWORD"],warehouse="WH_SAP_LOAD",database="V2RETAIL",schema="BRONZE")
          cur=con.cursor()
          try: cur.execute("USE SECONDARY ROLES ALL")
          except Exception: pass
          reqs=cur.execute("SELECT REQUEST_ID,TABLE_NAME,MODE,START_DATE,END_DATE FROM V2RETAIL.BRONZE.SYNC_REQUEST WHERE STATUS='PENDING' ORDER BY REQUESTED_AT LIMIT 20").fetchall()
          if not reqs: print("no pending requests"); con.close(); raise SystemExit
          pat=os.environ.get("GH_PAT","")
          env=dict(os.environ)
          if pat: env["GH_TOKEN"]=pat
          for rid,tbl,mode,sd,ed in reqs:
              full="true" if str(mode).lower()=="full" else "false"
              args=["gh","workflow","run","incremental-sync.yml","-R","akash0631/rfc-api","-f","table="+str(tbl),"-f","full="+full]
              if str(mode).lower()=="daterange" and sd and ed: args+=["-f","start_date="+str(sd),"-f","end_date="+str(ed)]
              try:
                  subprocess.run(args,check=True,env=env,capture_output=True,text=True)
                  cur.execute("UPDATE V2RETAIL.BRONZE.SYNC_REQUEST SET STATUS='DISPATCHED' WHERE REQUEST_ID=%s",(rid,)); print("dispatched",tbl,mode)
              except Exception as e:
                  cur.execute("UPDATE V2RETAIL.BRONZE.SYNC_REQUEST SET STATUS='ERROR',NOTE=%s WHERE REQUEST_ID=%s",(str(e)[:500],rid)); print("dispatch failed",tbl,str(e)[:200])
          con.close(); print("poller done")
          '@
          Set-Content -Path poller.py -Value $src -Encoding utf8
          & "$env:PYEXE" poller.py
