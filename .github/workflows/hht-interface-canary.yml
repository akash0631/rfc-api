name: HHT interface canary (SAP PROD)

# Watches every HHT function-module interface in SAP PROD and fails the moment one
# changes shape.
#
# WHY:
#   DEV/QA HHT traffic goes through rfc-api, which since 2026-08-13 self-heals a stale
#   NCo metadata cache and reports dropped parameters in _PARAM_ERRORS. PROD traffic does
#   not: it goes Azure -> Hybrid Connection -> 192.168.144.200:9080 Java middleware, whose
#   JCo repository has no cache invalidation anywhere in the war (506 JCoRepository
#   references, zero removeFunctionTemplateFromCache) and whose parameter binder iterates
#   the SAP-side field list, so a parameter it has not cached is skipped in complete
#   silence — no error, no log, no echo. Restarting the Azure app does NOT clear it. Only
#   a Tomcat restart on .200 does, and that host is not remotely administrable from CI.
#
#   So PROD cannot fix itself and cannot tell you it is broken. This job is the smoke
#   detector: a changed interface means a transport just landed, which means the Java MW
#   is stale as of that moment, which means a new parameter is silently arriving blank
#   on ~1000 devices until someone restarts Tomcat.
#
# COST: ~229 function-module metadata reads once a day. Each drops one FM from the .36
# NCo cache and re-reads it from SAP — that clearing is the point, it is what makes the
# answer ground truth instead of another cached copy, and it is harmless (the next proxy
# call re-reads in about a second). No RFC is executed. Nothing is written.
#
# AFTER A CHANGE: check whether the Java MW really is stale for that FM (hht_gateway_probe
# on a read-only FM, or the data an FM writes). If it is, add the FM to
# HHT_PROD_FORCE_RFC_API on v2-hht-api. Then re-baseline
#   python tools/hht_interface_canary.py --snapshot
# and commit tools/hht_fm_interfaces.prod.json.
#
# ALERTING: a red run opens (or comments on) one GitHub issue labelled hht-canary and
# assigned to akash0631, and a green run closes it. From 22 to 30 Sep 2026 this job was red
# every day and nobody saw it, because a failed scheduled run notifies no one reliably.

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 03:00 IST — an hour before the .36 pool recycle
  workflow_dispatch:
    inputs:
      env:
        description: 'SAP environment to check'
        required: true
        default: 'prod'
        type: choice
        options: [prod, qa, dev]
  push:
    branches: [master]
    paths:
      - 'tools/hht_interface_canary.py'
      - 'tools/hht_fm_watchlist.txt'
      - 'tools/hht_fm_interfaces.prod.json'
      - '.github/workflows/hht-interface-canary.yml'

jobs:
  canary:
    name: Compare live SAP interfaces against baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for interface drift
        id: check
        env:
          # Same key the controller already hardcodes as API_KEY, so the secret is
          # optional — set repo secret RFC_API_KEY to override.
          RFC_API_KEY: ${{ secrets.RFC_API_KEY || 'v2-rfc-proxy-2026' }}
          RFC_ENV: ${{ github.event.inputs.env || 'prod' }}
        run: |
          set -o pipefail
          python tools/hht_interface_canary.py 2>&1 | tee canary.log

      - name: Publish result to job summary
        if: always()
        env:
          RFC_ENV: ${{ github.event.inputs.env || 'prod' }}
        run: |
          {
            echo "## HHT interface canary — \`${RFC_ENV}\`"
            echo ''
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo 'No drift. The Java MW on 192.168.144.200 is consistent with SAP.'
            else
              echo '**Interface drift detected — SAP PROD changed since the baseline.**'
              echo ''
              echo 'Check whether the Java MW on .200 is stale for these FMs before acting, then re-baseline.'
            fi
            echo ''
            echo '```'
            cat canary.log 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise or clear the alert issue
        if: always() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          TITLE="HHT interface canary is red"
          gh label create hht-canary --color B60205 --description "HHT interface canary alert" 2>/dev/null || true
          OPEN=$(gh issue list --label hht-canary --state open --json number -q '.[0].number')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "Green again: run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            fi
            exit 0
          fi
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo 'SAP PROD interfaces differ from tools/hht_fm_interfaces.prod.json.'
            echo 'Verify each FM before acting. If the Java MW on .200 is stale, add the FM to HHT_PROD_FORCE_RFC_API on v2-hht-api.'
            echo 'If it is not, re-baseline: python tools/hht_interface_canary.py --snapshot'
            echo ''
            echo '```'
            tail -c 60000 canary.log 2>/dev/null || echo '(no output captured)'
            echo '```'
          } > alert.md
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file alert.md
          else
            gh issue create --title "$TITLE" --label hht-canary --assignee akash0631 --body-file alert.md
          fi
