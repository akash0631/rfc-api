name: QA OData -> BRONZE full load (no-date masters)

# Full-table paged pull from QA/DEV OData -> CREATE OR REPLACE all-VARCHAR BRONZE table.
# For tables with NO date field to window on (masters/texts). Runs on .36 (on-LAN, reaches
# QA 192.168.144.179:8000). Deep $skip degrades past ~1M rows -> use only for small/medium tables.

on:
  workflow_dispatch:
    inputs:
      service:      { description: 'OData service e.g. Z_SB_SKAT_FULL', required: true, type: string }
      entity:       { description: 'Entity set e.g. SkatFull', required: true, type: string }
      target_table: { description: 'Snowflake target e.g. V2RETAIL.BRONZE.SAP_SKAT', required: true, type: string }
      keys:         { description: 'Comma key cols for $orderby+dedup e.g. spras,ktopl,saknr', required: true, type: string }
      env:          { description: 'qa or dev', required: true, default: 'qa', type: string }

concurrency:
  group: qa-fullload-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  load:
    runs-on: [self-hosted, iis]
    timeout-minutes: 120
    steps:
      - name: Deps
        shell: powershell
        run: python -m pip install --quiet --upgrade "snowflake-connector-python[pandas]" pandas pyarrow
      - name: Full load
        shell: powershell
        env:
          SERVICE:      ${{ inputs.service }}
          ENTITY:       ${{ inputs.entity }}
          TARGET_TABLE: ${{ inputs.target_table }}
          KEYS:         ${{ inputs.keys }}
          ODATA_ENV:    ${{ inputs.env }}
          SAP_QA_USER:  ${{ secrets.SAP_QA_USER }}
          SAP_QA_PASS:  ${{ secrets.SAP_QA_PASS }}
          SAP_DEV_USER: ${{ secrets.SAP_DEV_USER }}
          SAP_DEV_PASS: ${{ secrets.SAP_DEV_PASS }}
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USER:      ${{ secrets.SF_USER }}
          SF_PASSWORD:  ${{ secrets.SF_PASSWORD }}
        run: |
          $py = @'
          import os, sys, json, base64, time, re, socket, urllib.request, urllib.parse
          from datetime import datetime, timezone
          import pandas as pd, snowflake.connector
          from snowflake.connector.pandas_tools import write_pandas
          socket.setdefaulttimeout(600)
          SERVICE=os.environ['SERVICE']; ENTITY=os.environ['ENTITY']; TGT=os.environ['TARGET_TABLE']
          KEYS=[k.strip() for k in os.environ['KEYS'].split(',') if k.strip()]; ENV=os.environ['ODATA_ENV']
          if ENV=='qa': HOST='http://192.168.144.179:8000'; CL='600'; U=os.environ['SAP_QA_USER']; P=os.environ['SAP_QA_PASS']
          else:         HOST='http://192.168.144.174:8000'; CL='210'; U=os.environ['SAP_DEV_USER']; P=os.environ['SAP_DEV_PASS']
          AUTH=base64.b64encode(f"{U}:{P}".encode()).decode()
          BASE=f"{HOST}/sap/opu/odata/sap/{SERVICE}/{ENTITY}?sap-client={CL}&%24format=json"
          H={'Authorization':f'Basic {AUTH}','Accept':'application/json','User-Agent':'V2-QA-Fullload/1.0'}
          dr=re.compile(r"/Date\((-?\d+)\)/")
          def conv(v):
              m=dr.search(v)
              if not m: return v
              ms=int(m.group(1))
              if ms>=253402214400000: return None
              return datetime.fromtimestamp(ms/1000,tz=timezone.utc).replace(tzinfo=None).strftime("%Y-%m-%d %H:%M:%S")
          ob=",".join(KEYS); rows=[]; skip=0; PAGE=2000; t0=time.time()
          while True:
              url=f"{BASE}&%24orderby={ob}&%24top={PAGE}&%24skip={skip}"
              for a in range(6):
                  try:
                      req=urllib.request.Request(url,headers=H)
                      with urllib.request.urlopen(req,timeout=600) as r: data=json.loads(r.read().decode('utf-8')); break
                  except Exception as e: print("retry",a+1,str(e)[:70],flush=True); time.sleep(min(30,2**a))
              else: raise SystemExit("pull failed")
              pg=data.get('d',{}).get('results',[])
              if not pg: break
              for rec in pg:
                  rec.pop('__metadata',None)
                  rows.append({k.upper():(conv(v) if isinstance(v,str) and v.startswith('/Date(') else (str(v) if v is not None else None)) for k,v in rec.items()})
              skip+=PAGE; print("pulled",len(rows),flush=True)
              if len(pg)<PAGE: break
          print("PULL",len(rows),"in",int(time.time()-t0),"s",flush=True)
          if not rows: print("no rows"); sys.exit(0)
          cols=sorted({k for r in rows for k in r})
          df=pd.DataFrame(rows).reindex(columns=cols).astype(object).where(lambda x:x.notna(),None)
          kk=[k.upper() for k in KEYS if k.upper() in df.columns]
          if kk: df=df.drop_duplicates(subset=kk,keep='last')
          print("rows after dedup",len(df),flush=True)
          con=snowflake.connector.connect(account=os.environ['SF_ACCOUNT'],user=os.environ['SF_USER'],password=os.environ['SF_PASSWORD'],warehouse='WH_SAP_LOAD',database='V2RETAIL',schema='BRONZE')
          cur=con.cursor()
          try: cur.execute("USE SECONDARY ROLES ALL")
          except Exception as e: print("secroles",e)
          cur.execute("CREATE OR REPLACE TABLE "+TGT+" ("+",".join('"'+c+'" VARCHAR' for c in cols)+")")
          write_pandas(con,df,TGT.split('.')[-1],database='V2RETAIL',schema='BRONZE',quote_identifiers=True)
          n=cur.execute("SELECT COUNT(*) FROM "+TGT).fetchone()[0]
          print("TARGET",TGT,"=",n,flush=True); con.close(); print("DONE")
          '@
          Set-Content -Path qa_fullload.py -Value $py -Encoding utf8
          python qa_fullload.py
