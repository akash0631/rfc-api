name: SAP -> Snowflake BRONZE daily sync

# Fires once per day at 07:00 IST (01:30 UTC) and can be manually re-run for
# any historical date window via workflow_dispatch.
#
# Runs on the self-hosted .36 IIS runner and calls http://localhost:9292 directly,
# bypassing the public Cloudflare proxy at sap-api.v2retail.net. This removes
# Cloudflare's hard 100s response timeout that was killing 4 of the larger RFCs
# (ZPBI_ART_SALES, ZMM_STO_PURN_RFC, ZPBI_GOODS_MVT, ZPBI_ART_MASTER) which
# legitimately take 100-1800s at SAP. Internal calls are not capped.
#
# Safety: all SAP overload guards still live in the IIS wrapper itself
# (rate-limit, per-RFC concurrency lock, STATUS gate, SAP timeout).
# This job loops the catalog of registered RFCs and POSTs the previous day's
# date window. TableDump-pattern RFCs (READ_*) ignore the date params.
#
# See docs/SAP-SNOWFLAKE-PIPELINE.md and docs/SAFEGUARDS.md for design.

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST daily
  workflow_dispatch:
    inputs:
      date_from:
        description: 'YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string
      date_to:
        description: 'YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string
      rfc_list:
        description: 'CSV of RFCs (default: 8 known-working)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # only one bronze-sync run at a time globally, even across schedule + dispatch
  group: rfc-bronze-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, iis]
    strategy:
      fail-fast: false
      max-parallel: 2          # don't hammer SAP — at most 2 RFCs concurrently
      matrix:
        rfc:
          # 8 legacy Z-RFCs (PerDate / PerStore / Single execution patterns)
          - RFC_ARTICLE_MASTER
          - RFC_GRC_DATA_APPLICATION
          - RFC_Sales_Data
          - RFC_ZPBI_Vendor_Payment
          - ZMM_STO_PURN_RFC
          - ZMM_VND_PUR
          - RFC_ALL_MOVEMENT
          - RFC_PLANT_MASTER
          # 4 TableDump small masters (RFC_READ_TABLE; date params ignored)
          - READ_T001W
          - READ_T005T
          - READ_T023T
          - READ_T005U
    steps:
      - name: Resolve date window
        id: dates
        shell: bash
        run: |
          if [ -n "${{ inputs.date_from }}" ] && [ -n "${{ inputs.date_to }}" ]; then
            FROM="${{ inputs.date_from }}"
            TO="${{ inputs.date_to }}"
          else
            FROM=$(date -u -d "yesterday" +%F)
            TO=$FROM
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO"     >> "$GITHUB_OUTPUT"
          echo "Window: $FROM -> $TO for ${{ matrix.rfc }}"

      - name: POST /api/execute/${{ matrix.rfc }}/sync
        shell: bash
        env:
          RFC_API_KEY: ${{ secrets.RFC_API_KEY }}
          RESP_FILE: ${{ runner.temp }}/resp_${{ matrix.rfc }}.json
        run: |
          set -euo pipefail
          FROM="${{ steps.dates.outputs.from }}"
          TO="${{ steps.dates.outputs.to }}"
          PAYLOAD=$(printf '{"DateFrom":"%s","DateTo":"%s"}' "$FROM" "$TO")
          echo "Posting to ${{ matrix.rfc }} with $PAYLOAD"
          # Internal endpoint — no Cloudflare proxy, so no 100s response cap.
          # 30-min curl timeout covers worst-case ZPBI_GOODS_MVT (~30 min) and
          # leaves headroom for ZPBI_ART_SALES (~2 min) and ZMM_STO_PURN (~3 min).
          # SAP-side timeout is enforced separately by ep.TimeoutSeconds (3600s).
          HTTP_STATUS=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
            --max-time 1800 \
            -X POST "http://localhost:9292/api/execute/${{ matrix.rfc }}/sync" \
            -H "X-RFC-Key: $RFC_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || HTTP_STATUS="curl_failed"
          echo "HTTP $HTTP_STATUS"
          cat "$RESP_FILE" || true
          echo
          # Allow 200 (OK) only. Any 4xx/5xx fails the matrix cell so we see it
          # in the GHA UI without retrying (rate limit + concurrency guards in
          # the wrapper already handle transient cases).
          case "$HTTP_STATUS" in
            200) exit 0 ;;
            *)   exit 1 ;;
          esac
