name: SAP -> Snowflake BRONZE daily sync

# Fires on 6 time-buckets matching the legacy `\192.168.151.28\` task scheduler
# on `.24` so each RFC pulls SAP at the same time the .NET legacy app does.
# All buckets can be manually re-run via workflow_dispatch with custom
# date_from/date_to and rfc_list inputs.
#
# Runs on the self-hosted .36 IIS runner and calls http://localhost:9292 directly,
# bypassing the public Cloudflare proxy at sap-api.v2retail.net. This removes
# Cloudflare's hard 100s response timeout that was killing 4 of the larger RFCs
# (ZPBI_ART_SALES, ZMM_STO_PURN_RFC, ZPBI_GOODS_MVT, ZPBI_ART_MASTER) which
# legitimately take 100-1800s at SAP. Internal calls are not capped.
#
# Safety: all SAP overload guards still live in the IIS wrapper itself
# (rate-limit, per-RFC concurrency lock, STATUS gate, SAP timeout).
# TableDump-pattern RFCs (READ_* and LOAD_SAP_*) ignore the date params.
#
# See docs/SAP-SNOWFLAKE-PIPELINE.md and docs/SAFEGUARDS.md for design.

on:
  schedule:
    # 6 buckets — same fire times as the legacy `.28` task scheduler on .24.
    # Each cron triggers the workflow; rfc_list is resolved per cron and the
    # job matrix filters cells whose rfc isn't in that bucket.
    - cron: '30 14 * * *'   # 20:00 IST — Evening masters (plants, vendors, customers, GL, mvt types, etc.)
    - cron: '30 16 * * *'   # 22:00 IST — Article master (MARA/ARTICLE_MASTER)
    - cron: '40 18 * * *'   # 00:10 IST — PO + open positions (EKKO/EKPO/EKBE)
    - cron: '0 19 * * *'    # 00:30 IST — Stock state (MARD/MARC/MCHB/MSKA/MSLB/MKOL/MSPR/LQUA/LTAP/LTAK)
    - cron: '0 20 * * *'    # 01:30 IST — Bulk transactional (GRC, sales, movements, FI docs, deliveries)
    - cron: '45 20 * * *'   # 02:15 IST — Valuation late (MBEW/EBEW/OBEW/QBEW)
  workflow_dispatch:
    inputs:
      date_from:
        description: 'YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string
      date_to:
        description: 'YYYY-MM-DD (default: yesterday UTC)'
        required: false
        type: string
      rfc_list:
        description: 'CSV of RFCs (overrides bucket; empty = run full matrix on manual dispatch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # only one bronze-sync run at a time globally, even across schedule + dispatch
  group: rfc-bronze-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, iis]
    strategy:
      fail-fast: false
      max-parallel: 2          # don't hammer SAP — at most 2 RFCs concurrently
      matrix:
        rfc:
          # 9 legacy Z-RFCs (PerDate / PerStore / Single execution patterns)
          - RFC_ARTICLE_MASTER
          - RFC_GRC_DATA_APPLICATION
          - RFC_Sales_Data
          - RFC_STOCK_DATA
          - RFC_ZPBI_Vendor_Payment
          - ZMM_STO_PURN_RFC
          - ZMM_VND_PUR
          - RFC_ALL_MOVEMENT
          - RFC_PLANT_MASTER
          # 15 Phase-1 master Z-RFCs (Single/PerDate; ZPBI_*/Z*_RFC functions) — added 2026-06-16 (b1 + b2)
          - RFC_Country_MASTER
          - RFC_STATE_MASTER
          - RFC_MC_MASTER
          - RFC_VND_MASTER
          - RFC_ARTICLE_COLOUR
          # Batch-2 (10 more)
          - ZCT04_CHAR_GET_RFC
          - ZART_BAR_DETAIL_RFC
          - ZMC_SIZE_MASTER_RFC
          - ZMM_MARM_GET_RFC
          - ZMM_SIZE_MAPPING_GET_RFC
          - ZFI_GRC_DETAILS_RFC
          - ZFI_PI_DATA_RFC
          - ZKSB1_RFC
          - ZMM_VND_SER_RFC
          - ZRFC_CUST_FIELDS
          # 4 TableDump small masters (RFC_READ_TABLE; date params ignored)
          - READ_T001W
          - READ_T005T
          - READ_T023T
          - READ_T005U
          # 29 SAP_* inventory mirrors (per spec 11_INVENTORY_SOT_SAP_TO_SF_2026-06-03.md)
          # Pilot scope = HB05 + DH24 via FILTER_CLAUSE in RFC_MASTER. Date params ignored.
          - LOAD_SAP_T001W
          - LOAD_SAP_T001L
          - LOAD_SAP_T156
          - LOAD_SAP_T156T
          - LOAD_SAP_MARA
          - LOAD_SAP_MAKT
          - LOAD_SAP_MARD
          - LOAD_SAP_MARC
          - LOAD_SAP_MCHB
          - LOAD_SAP_MSKA
          - LOAD_SAP_MSLB
          - LOAD_SAP_MKOL
          - LOAD_SAP_MSPR
          - LOAD_SAP_MSKU
          - LOAD_SAP_LQUA
          - LOAD_SAP_MBEW
          - LOAD_SAP_EBEW
          - LOAD_SAP_OBEW
          - LOAD_SAP_QBEW
          - LOAD_SAP_EKPO
          - LOAD_SAP_EKKO
          - LOAD_SAP_EKBE
          - LOAD_SAP_LIPS
          - LOAD_SAP_LIKP
          - LOAD_SAP_LTAP
          - LOAD_SAP_LTAK
          - LOAD_SAP_VBBE
          - LOAD_SAP_MSEG
          - LOAD_SAP_MKPF
          - LOAD_SAP_LFA1
          - LOAD_SAP_VBAK
          - LOAD_SAP_VBAP
          - LOAD_SAP_VBFA
          - LOAD_SAP_VBRK
          - LOAD_SAP_VBRP
          - LOAD_SAP_BKPF
          - LOAD_SAP_BSEG
          - LOAD_SAP_FAGLFLEXA
          - LOAD_SAP_KNA1
          - LOAD_SAP_SKA1
          - LOAD_SAP_SKB1
          - LOAD_SAP_TCURR
    steps:
      - name: Resolve rfc_list from schedule (bucket routing)
        id: rfclist
        shell: powershell
        run: |
          $sched = "${{ github.event.schedule }}"
          $userList = "${{ inputs.rfc_list }}"
          if ($userList) {
            $list = $userList
            Write-Host "Using user-supplied rfc_list: $list"
          } elseif (-not $sched) {
            $list = ''
            Write-Host "Manual dispatch with no rfc_list -> run full matrix"
          } else {
            switch ($sched) {
              '30 14 * * *' { $list = 'LOAD_SAP_T001W,LOAD_SAP_T001L,LOAD_SAP_T156,LOAD_SAP_T156T,LOAD_SAP_MAKT,LOAD_SAP_MSKU,LOAD_SAP_LFA1,LOAD_SAP_KNA1,LOAD_SAP_SKA1,LOAD_SAP_SKB1,LOAD_SAP_TCURR,READ_T001W,READ_T005T,READ_T023T,READ_T005U,RFC_PLANT_MASTER,RFC_ZPBI_Vendor_Payment,ZMM_VND_PUR,RFC_Country_MASTER,RFC_STATE_MASTER,RFC_MC_MASTER,RFC_VND_MASTER,RFC_ARTICLE_COLOUR,ZCT04_CHAR_GET_RFC,ZART_BAR_DETAIL_RFC,ZMC_SIZE_MASTER_RFC,ZMM_MARM_GET_RFC,ZMM_SIZE_MAPPING_GET_RFC,ZFI_GRC_DETAILS_RFC,ZFI_PI_DATA_RFC,ZKSB1_RFC,ZMM_VND_SER_RFC,ZRFC_CUST_FIELDS' }
              '30 16 * * *' { $list = 'RFC_ARTICLE_MASTER,LOAD_SAP_MARA' }
              '40 18 * * *' { $list = 'LOAD_SAP_EKKO,LOAD_SAP_EKPO,LOAD_SAP_EKBE' }
              '0 19 * * *'  { $list = 'LOAD_SAP_MARD,LOAD_SAP_MARC,LOAD_SAP_MCHB,LOAD_SAP_MSKA,LOAD_SAP_MSLB,LOAD_SAP_MKOL,LOAD_SAP_MSPR,LOAD_SAP_LQUA,LOAD_SAP_LTAP,LOAD_SAP_LTAK,RFC_STOCK_DATA' }
              '0 20 * * *'  { $list = 'ZMM_STO_PURN_RFC,RFC_GRC_DATA_APPLICATION,LOAD_SAP_BKPF,LOAD_SAP_BSEG,LOAD_SAP_FAGLFLEXA,RFC_ALL_MOVEMENT,LOAD_SAP_MSEG,LOAD_SAP_MKPF,RFC_Sales_Data,LOAD_SAP_VBAK,LOAD_SAP_VBAP,LOAD_SAP_VBFA,LOAD_SAP_VBRK,LOAD_SAP_VBRP,LOAD_SAP_VBBE,LOAD_SAP_LIPS,LOAD_SAP_LIKP' }
              '45 20 * * *' { $list = 'LOAD_SAP_MBEW,LOAD_SAP_EBEW,LOAD_SAP_OBEW,LOAD_SAP_QBEW' }
              default       { $list = '' }
            }
            Write-Host "Scheduled fire '$sched' -> rfc_list: $list"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "rfc_list=$list"

      - name: Resolve date window
        id: dates
        if: ${{ steps.rfclist.outputs.rfc_list == '' || contains(format(',{0},', steps.rfclist.outputs.rfc_list), format(',{0},', matrix.rfc)) }}
        shell: powershell
        run: |
          $dateFromInput = "${{ inputs.date_from }}"
          $dateToInput   = "${{ inputs.date_to }}"
          if ($dateFromInput -and $dateToInput) {
            $FROM = $dateFromInput
            $TO   = $dateToInput
          } else {
            $FROM = (Get-Date).ToUniversalTime().AddDays(-1).ToString("yyyy-MM-dd")
            $TO   = $FROM
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "from=$FROM"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "to=$TO"
          Write-Host "Window: $FROM -> $TO for ${{ matrix.rfc }}"

      - name: POST /api/execute/${{ matrix.rfc }}/sync
        if: ${{ steps.rfclist.outputs.rfc_list == '' || contains(format(',{0},', steps.rfclist.outputs.rfc_list), format(',{0},', matrix.rfc)) }}
        shell: powershell
        env:
          RFC_API_KEY: ${{ secrets.RFC_API_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $rfc     = "${{ matrix.rfc }}"
          $fromDt  = "${{ steps.dates.outputs.from }}"
          $toDt    = "${{ steps.dates.outputs.to }}"
          $payload = '{"DateFrom":"' + $fromDt + '","DateTo":"' + $toDt + '"}'
          Write-Host "Posting to $rfc with $payload"

          # Internal endpoint — no Cloudflare proxy, so no 100s response cap.
          # 60-min timeout covers worst-case ZPBI_GOODS_MVT — its PerStore loop
          # over 320 stores took 2,680s (~44 min) on 2026-05-30. ZPBI_ART_SALES
          # (~11 min) and ZMM_STO_PURN_RFC (~19 min) fit comfortably below this.
          # SAP-side timeout matches: ep.TimeoutSeconds=3600s.
          $uri = "http://localhost:9292/api/execute/$rfc/sync"
          $statusCode = 0
          $body = ""
          try {
            $resp = Invoke-WebRequest `
              -Uri $uri `
              -Method POST `
              -Headers @{ 'X-RFC-Key' = $env:RFC_API_KEY; 'Content-Type' = 'application/json' } `
              -Body $payload `
              -TimeoutSec 3600 `
              -UseBasicParsing `
              -ErrorAction Stop
            $statusCode = [int]$resp.StatusCode
            $body = $resp.Content
          } catch [System.Net.WebException] {
            if ($_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
              try {
                $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                $body = $reader.ReadToEnd()
              } catch { $body = "(could not read response body)" }
            } else {
              $statusCode = -1
              $body = "WebException with no Response: " + $_.Exception.Message
            }
          } catch {
            $statusCode = -1
            $body = "Unexpected error: " + $_.Exception.Message
          }
          Write-Host "HTTP $statusCode"
          Write-Host $body
          # Allow 200 (OK) only. Any other status fails the matrix cell so we see
          # it in the GHA UI without retrying (rate limit + concurrency guards in
          # the wrapper already handle transient cases).
          if ($statusCode -eq 200) { exit 0 } else { exit 1 }
