name: SAP PROD OData -> BRONZE incremental sync

# Watermark-delta / full-refresh incremental (PROD OData -> stage -> MERGE|REPLACE) on the .36
# self-hosted runner (on-LAN, reaches SAP PROD 192.168.144.170:5202). Source = PROD OData ONLY.
# Auth = SAP_ODATA service user (secrets SAP_PROD_USER/PASS). Only PROD-authorized services run;
# the rest are config-ready and sync the moment their S_SERVICE auth is granted.
#
# Per-table CONFIG:  mode = "delta" (watermark -> MERGE on key) | "full" (truncate + reload).
# $select is built from the TARGET's business columns -> limits payload AND auto-excludes any
# poison column not present in the target (e.g. BSAK.zfbdt). A $top=1 probe disables $select if
# the service rejects it (so a schema drift can never break the pull).

on:
  workflow_dispatch:
    inputs:
      table: { description: 'Table key e.g. MARA / BSAK / SKAT', required: true, default: 'MARA', type: string }
      full:  { description: 'delta tables: ignore watermark & pull all', required: false, default: 'false', type: string }
      start_date: { description: 'date-range re-sync start YYYY-MM-DD (optional; overrides watermark)', required: false, default: '', type: string }
      end_date:   { description: 'date-range re-sync end YYYY-MM-DD (optional)', required: false, default: '', type: string }
  # DAILY CRON DISABLED — daily PROD->BRONZE sync now runs on .24 (schtasks V2_PROD_DAILY_SYNC @ 02:00 IST,
  # C:\temp\incr_sync_prod.py). GHA kept for manual workflow_dispatch + future parallel runners / backup.
  # schedule:
  #   - cron: '30 19 * * *'

concurrency:
  group: incr-sync-${{ github.event.inputs.table || 'cron' }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, iis]
    outputs:
      tables: ${{ steps.pick.outputs.tables }}
    steps:
      - id: pick
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'schedule') {
            # AUTHORIZED tables synced daily — add the 9 blocked ones here as they get S_SERVICE auth
            # LIKP held out: Z_SB_LIKP_FULL NOT registered on PROD (only skinny Z_SB_LIKP) -> awaiting Add Service. EKPO is fast (~48K/min), kept in.
            'tables=["MARA","BSAK","SKAT","CSKT","CSKS","EKKO","EKPO","VBRP","LIPS","LTAK","LQUA","MSKU"]' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'tables=["${{ github.event.inputs.table }}"]' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
  sync:
    needs: setup
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        table: ${{ fromJSON(needs.setup.outputs.tables) }}
    runs-on: [self-hosted, iis]
    timeout-minutes: 480
    steps:
      - name: Deps
        shell: powershell
        run: python -m pip install --quiet --upgrade "snowflake-connector-python[pandas]" pandas pyarrow
      - name: Run incremental sync
        shell: powershell
        env:
          TABLE:       ${{ matrix.table }}
          FULL:        ${{ github.event.inputs.full || 'false' }}
          START_DATE:  ${{ github.event.inputs.start_date }}
          END_DATE:    ${{ github.event.inputs.end_date }}
          SAP_PROD_USER: ${{ secrets.SAP_PROD_USER }}
          SAP_PROD_PASS: ${{ secrets.SAP_PROD_PASS }}
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          $py = @'
          import os, sys, re, json, ssl, base64, time, datetime, urllib.request, urllib.parse
          import pandas as pd, snowflake.connector
          from snowflake.connector.pandas_tools import write_pandas
          CONFIG = {
            # ---- delta (watermark -> MERGE) ----
            "MARA": dict(service="Z_SB_MARA_FULL", entity="MaraFull", target="SAP_MARA", keys=["MATNR"], date_fields=["laeda","ersda"], mode="delta"),
            "BSAK": dict(service="Z_SB_BSAK_FULL", entity="BsakFull", target="SAP_BSAK", keys=["BUKRS","LIFNR","GJAHR","BELNR","BUZEI"], date_fields=["budat","augdt"], mode="delta", dfmt="iso"),
            "EKKO": dict(service="Z_SB_EKKO_FULL", entity="EkkoFull", target="SAP_EKKO", keys=["EBELN"], date_fields=["aedat","bedat"], mode="delta"),
            "EKPO": dict(service="Z_SB_EKPO_FULL", entity="EkpoFull", target="SAP_EKPO", keys=["EBELN","EBELP"], date_fields=["aedat","bedat"], mode="delta"),
            # nkeys = key columns compared with leading zeros stripped on BOTH sides of the MERGE.
            # These four targets hold a mix of DDIC-padded and unpadded document numbers (VBRP:
            # 81M rows at len 8 vs 144M at len 10), so a raw t.VBELN=s.VBELN predicate matches
            # nothing and every row lands as an insert. See the tripwire below.
            "VBRK": dict(service="Z_SB_VBRK_FULL", entity="VbrkFull", target="SAP_VBRK", keys=["VBELN"], nkeys=["VBELN"], date_fields=["fkdat","erdat"], mode="delta"),
            # fkdat_ana probed first so backdated/late-created invoices are visible; runtime probe
            # drops it automatically if VbrpFull won't filter on it. erdat kept as the watermark driver.
            # overlap=7 (not the global 2): VBRP is the highest-volume delta and an outage longer than
            # `overlap` leaves a permanent hole -- see incident 2026-07-22 (FKDAT 07-03..07-09 lost).
            "VBRP": dict(service="Z_SB_VBRP_FULL", entity="VbrpFull", target="SAP_VBRP", keys=["VBELN","POSNR"], nkeys=["VBELN","POSNR"], date_fields=["erdat","aedat","fkdat_ana"], mode="delta", overlap=7),
            "LIPS": dict(service="Z_SB_LIPS_FULL", entity="LipsFull", target="SAP_LIPS", keys=["VBELN","POSNR"], nkeys=["VBELN","POSNR"], date_fields=["erdat"], mode="delta"),
            "LIKP": dict(service="Z_SB_LIKP_FULL", entity="LikpFull", target="SAP_LIKP", keys=["VBELN"], nkeys=["VBELN"], date_fields=["erdat","aedat"], mode="delta"),
            "LTAK": dict(service="Z_SB_LTAK", entity="LtakStk", target="SAP_LTAK", keys=["LGNUM","TANUM"], date_fields=["bdatu"], mode="delta", dfmt="iso"),
            # ---- full-refresh (truncate + reload) ----
            "SKAT": dict(service="Z_SB_SKAT_FULL", entity="SkatFull", target="SAP_SKAT", keys=["SPRAS","KTOPL","SAKNR"], date_fields=[], mode="full"),
            "CSKT": dict(service="Z_SB_CSKT_FULL", entity="CsktFull", target="SAP_CSKT", keys=["SPRAS","KOKRS","KOSTL","DATBI"], date_fields=[], mode="full"),
            "CSKS": dict(service="Z_SB_CSKS_FULL", entity="CsksFull", target="SAP_CSKS", keys=["KOKRS","KOSTL","DATBI"], date_fields=[], mode="full"),
            "LQUA": dict(service="Z_SB_LQUA_BIN", entity="LquaBin", target="SAP_LQUA_BIN", keys=["LGNUM","LQNUM"], date_fields=[], mode="full"),
            "MSKU": dict(service="Z_SB_MSKU", entity="MskuStk", target="SAP_MSKU", keys=["MATNR","WERKS","CHARG","SOBKZ","KUNNR"], date_fields=[], mode="full"),
            # ---- special: EKET has no own change-date -> driven by parent EKKO.AEDAT (separate driver) ----
            "EKET": dict(service="Z_SB_EKET_FULL", entity="EketFull", target="SAP_EKET", keys=["EBELN","EBELP","ETENR"], date_fields=[], mode="eket_via_ekko"),
          }
          LINEAGE={"DL_INGESTED_AT","DL_SOURCE","DL_BATCH_ID","DL_DELTA_TOKEN","EXTRACT_DATE","MANDT"}
          PROD="https://192.168.144.170:5202/sap/opu/odata/sap"; CLIENT="600"; PAGE=5000; OVERLAP=2
          AUTH=base64.b64encode((os.environ["SAP_PROD_USER"]+":"+os.environ["SAP_PROD_PASS"]).encode()).decode()
          tbl=os.environ["TABLE"].upper(); full=os.environ.get("FULL","false").lower()=="true"; c=CONFIG[tbl]
          mode=c.get("mode","delta")
          if mode=="eket_via_ekko":
              print("EKET syncs via parent EKKO.AEDAT (needs EKKO live) - use the dedicated EKET driver, not this workflow. Exiting."); sys.exit(0)
          con=snowflake.connector.connect(account=os.environ["SF_ACCOUNT"],user=os.environ["SF_USER"],password=os.environ["SF_PASSWORD"],
              warehouse="WH_SAP_LOAD",database="V2RETAIL",schema="BRONZE")
          cur=con.cursor()
          try: cur.execute("USE SECONDARY ROLES ALL")
          except Exception as e: print("secroles:",e)
          RID=os.environ.get("GITHUB_RUN_ID","local")+"-"+tbl; ACTOR=os.environ.get("GITHUB_ACTOR","cron"); T0=datetime.datetime.utcnow()
          def logrow(status,pulled=0,ins=0,upd=0,tgt=0,err=None,flt=None):
              try:
                  t1=datetime.datetime.utcnow(); dur=int((t1-T0).total_seconds())
                  cur.execute("INSERT INTO V2RETAIL.BRONZE.SYNC_LOG(RUN_ID,TABLE_NAME,MODE,TRIGGERED_BY,STARTED_AT,ENDED_AT,DURATION_S,STATUS,FILTER_TEXT,ROWS_PULLED,ROWS_INSERTED,ROWS_UPDATED,TARGET_COUNT,ERROR) SELECT %s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s",(RID,tbl,mode,ACTOR,T0,t1,dur,status,flt,pulled,ins,upd,tgt,(str(err)[:1500] if err else None)))
              except Exception as e: print("logrow err",e)
          coltype={r[0].upper():r[1] for r in cur.execute("SELECT COLUMN_NAME,DATA_TYPE FROM V2RETAIL.INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='BRONZE' AND TABLE_NAME='"+c["target"]+"'").fetchall()}
          if not coltype: print("target BRONZE."+c["target"]+" not found"); sys.exit(1)
          TS={k for k,v in coltype.items() if v.startswith("TIMESTAMP")}; ALL=set(coltype)
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          dr=re.compile(r"/Date\((-?\d+)\)/"); DFMT=c.get("dfmt","ymd")
          def conv(v,ts):
              m=dr.search(str(v))
              if not m: return None
              s=int(m.group(1))/1000.0
              if s<0 or s>253402300799: return None
              d=datetime.datetime(1970,1,1)+datetime.timedelta(seconds=s)
              return d.strftime("%Y-%m-%d %H:%M:%S") if (ts or DFMT=="iso") else d.strftime("%Y%m%d")
          def od(params,retries=6):
              url=PROD+"/"+c["service"]+"/"+c["entity"]+"?"+params; last=None
              for a in range(retries):
                  try:
                      rq=urllib.request.Request(url,headers={"Authorization":"Basic "+AUTH,"Accept":"application/json"})
                      with urllib.request.urlopen(rq,context=ctx,timeout=600) as r: return json.load(r)["d"]["results"]
                  except Exception as e: last=e; print("retry",a+1,str(e)[:70]); time.sleep(min(30,2**a))
              raise last
          # $select = target business cols (limits payload + auto-excludes poison cols absent from target)
          selcols=[k.lower() for k in ALL if k not in LINEAGE]
          selc="&$select="+urllib.parse.quote(",".join(selcols)) if selcols else ""
          if selc:
              try: od("$format=json&$top=1&sap-client="+CLIENT+selc)
              except Exception as e: print("$select probe failed -> full-column pull:",str(e)[:70]); selc=""
          # drop date fields the entity won't filter on (e.g. VBRP/LIKP aedat not projected -> 400 Bad Request)
          if c["date_fields"]:
              _ok=[]
              for _d in c["date_fields"]:
                  try: od("$format=json&$top=1&sap-client="+CLIENT+"&$filter="+urllib.parse.quote(_d+" ge datetime'2000-01-01T00:00:00'"),retries=2); _ok.append(_d)
                  except Exception as _e: print("date field",_d,"not filterable -> drop:",str(_e)[:45])
              c["date_fields"]=_ok
              if not _ok and mode=="delta" and not full: print("ABORT: no filterable date field for",tbl,"- fix CONFIG date_fields"); sys.exit(1)
          # watermark (delta only)
          flt=""
          SD=os.environ.get("START_DATE","").strip(); ED=os.environ.get("END_DATE","").strip()
          if SD and ED and c["date_fields"]:
              flt=" or ".join("("+d+" ge datetime'"+SD+"T00:00:00' and "+d+" lt datetime'"+ED+"T00:00:00')" for d in c["date_fields"])
              print("DATE-RANGE re-sync",SD,"..",ED)
          elif mode=="delta" and not full and c["date_fields"]:
              df0=c["date_fields"][0].upper()
              mx=cur.execute("SELECT MAX("+df0+") FROM V2RETAIL.BRONZE."+c["target"]).fetchone()[0]
              if mx is not None:
                  if df0 in TS: base=mx
                  elif "-" in str(mx): base=datetime.datetime.strptime(str(mx)[:10],"%Y-%m-%d")
                  else: base=datetime.datetime.strptime(str(mx)[:8],"%Y%m%d")
                  wm=(base-datetime.timedelta(days=c.get("overlap",OVERLAP))).strftime("%Y-%m-%dT00:00:00")
                  flt=" or ".join(d+" ge datetime'"+wm+"'" for d in c["date_fields"])
          print("table",tbl,"mode",mode,"filter:",flt or "(full pull)","select:",bool(selc))
          rows=[]; skip=0; t0=time.time()
          while True:
              p="$format=json&$top="+str(PAGE)+"&$skip="+str(skip)+"&$orderby="+",".join(k.lower() for k in c["keys"])+"&sap-client="+CLIENT+selc
              if flt: p+="&$filter="+urllib.parse.quote(flt)
              pg=od(p)
              if not pg: break
              for rec in pg:
                  row={}
                  for k,v in rec.items():
                      K=k.upper()
                      if K=="__METADATA" or K not in ALL: continue
                      if v is None: row[K]=None
                      elif isinstance(v,bool): row[K]="true" if v else "false"
                      elif K in TS or dr.search(str(v)): row[K]=conv(v, K in TS)
                      else: row[K]=str(v)
                  rows.append(row)
              skip+=PAGE; print("pulled",len(rows))
              if len(pg)<PAGE: break
          print("PULL",len(rows),"in",int(time.time()-t0),"s")
          if not rows:
              tgtc=cur.execute("SELECT COUNT(*) FROM V2RETAIL.BRONZE."+c["target"]).fetchone()[0]
              print("nothing new - target unchanged"); logrow("SUCCESS",0,0,0,tgtc,flt=flt); con.close(); sys.exit(0)
          cols=sorted({k for r in rows for k in r})
          df=pd.DataFrame(rows).reindex(columns=cols).astype(object).where(lambda x:x.notna(),None)
          df=df.drop_duplicates(subset=[k for k in c["keys"] if k in df.columns],keep="last")
          print("after dedup:",len(df))
          stg=c["target"]+"_INCR_STG"
          cur.execute("CREATE OR REPLACE TABLE V2RETAIL.BRONZE."+stg+" ("+",".join('"'+x+'" VARCHAR' for x in cols)+")")
          write_pandas(con,df,stg,database="V2RETAIL",schema="BRONZE",quote_identifiers=True)
          def src(x): return ('TO_TIMESTAMP_NTZ(s."'+x+'")') if x in TS else ('s."'+x+'"')
          nins=0; nupd=0
          if mode=="full":
              inscols="("+",".join('"'+x+'"' for x in cols)+")"
              sel=",".join(src(x) for x in cols)
              cur.execute("TRUNCATE TABLE V2RETAIL.BRONZE."+c["target"])
              cur.execute("INSERT INTO V2RETAIL.BRONZE."+c["target"]+" "+inscols+" SELECT "+sel+" FROM V2RETAIL.BRONZE."+stg+" s")
              r=cur.fetchall(); nins=(r[0][0] if r and r[0] else len(df)); print("FULL-REFRESH inserted:",r)
          else:
              nk=set(c.get("nkeys",[]))
              def kx(a,k,force=False): return ("LTRIM("+a+'."'+k+"\",'0')") if (force or k in nk) else (a+'."'+k+'"')
              on=" AND ".join(kx("t",k)+"="+kx("s",k) for k in c["keys"])
              on_norm=" AND ".join(kx("t",k,True)+"="+kx("s",k,True) for k in c["keys"])
              upd=", ".join('t."'+x+'"='+src(x) for x in cols if x not in c["keys"])
              insv="("+",".join('"'+x+'"' for x in cols)+") VALUES ("+",".join(src(x) for x in cols)+")"
              def hits(pred):
                  return cur.execute("SELECT COUNT(*) FROM V2RETAIL.BRONZE."+stg+" s WHERE EXISTS (SELECT 1 FROM V2RETAIL.BRONZE."+c["target"]+" t WHERE "+pred+")").fetchone()[0]
              # Tripwire. On 2026-07-22 a re-sync inserted 2,538,714 rows and updated 0 -- the pull
              # writes DDIC-padded keys, the target held unpadded ones, so the ON predicate never
              # matched and every document got a second copy (2,088,099 dup rows, ~112 Cr phantom
              # NETWR). Two checks close that hole for good:
              #   1. before the MERGE, if stripping leading zeros finds matches the live predicate
              #      misses, the key formats have drifted -- abort rather than double-count.
              #   2. after the MERGE, inside a transaction, insert count must equal the staged rows
              #      that had no match. More than that means the predicate under-matched; roll back.
              exp=hits(on)
              if not nk:
                  alt=hits(on_norm)
                  if alt>exp:
                      raise RuntimeError("key format drift on %s: ON matches %d staged rows, zero-stripped ON matches %d. Add nkeys to CONFIG before loading."%(c["target"],exp,alt))
              print("staged rows already in target:",exp,"of",len(df))
              cur.execute("BEGIN")
              try:
                  cur.execute("MERGE INTO V2RETAIL.BRONZE."+c["target"]+" t USING V2RETAIL.BRONZE."+stg+" s ON "+on+" WHEN MATCHED THEN UPDATE SET "+upd+" WHEN NOT MATCHED THEN INSERT "+insv)
                  r=cur.fetchall(); nins=(r[0][0] if r and r[0] else 0); nupd=(r[0][1] if r and r[0] and len(r[0])>1 else 0); print("MERGE (ins,upd):",r)
                  if nins>len(df)-exp:
                      raise RuntimeError("MERGE double-count on %s: inserted %d, expected at most %d (%d staged, %d already present). Rolled back."%(c["target"],nins,len(df)-exp,len(df),exp))
                  cur.execute("COMMIT")
              except Exception:
                  try: cur.execute("ROLLBACK")
                  except Exception as re_: print("ROLLBACK failed:",re_)
                  raise
          tgt=cur.execute("SELECT COUNT(*) FROM V2RETAIL.BRONZE."+c["target"]).fetchone()[0]
          print("target now:",tgt); logrow("SUCCESS",len(df),nins,nupd,tgt,flt=flt)
          # Post-load completeness probe. A watermark of MAX(date)-overlap cannot detect a hole it
          # already skipped past, so assert on business-date coverage instead of on the watermark.
          # NON-FATAL by design: this must never fail a good nightly load, only make a hole visible.
          if tbl=="VBRP":
              try:
                  gaps=cur.execute("SELECT FKDAT,DOCS,PLANTS,NETWR_CR,PCT_OF_REF,VERDICT "
                                   "FROM V2RETAIL.BRONZE.V_SYNC_GAP_VBRP "
                                   "WHERE VERDICT IN ('GAP','PARTIAL') "
                                   "AND FKDAT >= DATEADD(day,-30,CURRENT_DATE) "
                                   "AND FKDAT <  DATEADD(day,-1,CURRENT_DATE) ORDER BY FKDAT").fetchall()
                  if gaps:
                      for g in gaps:
                          print("::warning title=VBRP bronze gap::FKDAT %s %s - %s docs, %s plants, %s Cr (%s%% of trailing avg)"
                                % (g[0],g[5],g[1],g[2],g[3],g[4]))
                      lo=str(min(g[0] for g in gaps)); hi=str(max(g[0] for g in gaps))
                      print("::warning title=VBRP repair::Re-sync bypasses the watermark and MERGEs on zero-stripped "
                            "VBELN+POSNR; the tripwire rolls the MERGE back if it inserts more than the staged rows "
                            "that had no match. end_date is EXCLUSIVE. "
                            "gh workflow run incremental-sync.yml --ref master -f table=VBRP -f start_date=%s -f end_date=%s" % (lo,hi))
                  else:
                      print("gap probe: no GAP/PARTIAL days in trailing 30d")
              except Exception as e: print("gap probe skipped:",str(e)[:120])
          con.close(); print("DONE")
          '@
          Set-Content -Path incr_sync.py -Value $py -Encoding utf8
          python incr_sync.py
      - name: Log failure to SYNC_LOG
        if: failure()
        shell: powershell
        env:
          TABLE:       ${{ matrix.table }}
          SF_ACCOUNT:  ${{ secrets.SF_ACCOUNT }}
          SF_USER:     ${{ secrets.SF_USER }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          $py = @'
          import os, snowflake.connector
          con=snowflake.connector.connect(account=os.environ["SF_ACCOUNT"],user=os.environ["SF_USER"],password=os.environ["SF_PASSWORD"],warehouse="WH_SAP_LOAD",database="V2RETAIL",schema="BRONZE")
          cur=con.cursor()
          try: cur.execute("USE SECONDARY ROLES ALL")
          except Exception: pass
          rid=os.environ.get("GITHUB_RUN_ID","")+"-"+os.environ["TABLE"]
          cur.execute("INSERT INTO V2RETAIL.BRONZE.SYNC_LOG(RUN_ID,TABLE_NAME,MODE,TRIGGERED_BY,STARTED_AT,ENDED_AT,STATUS,ERROR) SELECT %s,%s,%s,%s,CURRENT_TIMESTAMP()::timestamp_ntz,CURRENT_TIMESTAMP()::timestamp_ntz,%s,%s",(rid,os.environ["TABLE"],"?",os.environ.get("GITHUB_ACTOR","cron"),"FAILED","run failed - see GHA run "+os.environ.get("GITHUB_RUN_ID","")))
          con.close(); print("logged FAILED")
          '@
          Set-Content -Path fail_log.py -Value $py -Encoding utf8
          python fail_log.py
