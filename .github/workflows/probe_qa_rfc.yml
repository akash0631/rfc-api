name: Probe QA RFC dest state on .36
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, iis]
    steps:
      - name: Read Web.config + smoke RFC proxy env=qa
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $wc = 'C:\V2RfcTest\Web.config'
          Write-Host "=== Web.config snippets w/ User/Password/Destination ==="
          if (Test-Path $wc) {
            $c = Get-Content $wc -Raw
            # Mask passwords before showing
            $masked = $c -replace '(Password\s*"\s+value\s*=\s*")[^"]+(")', '$1***MASKED***$2'
            $masked = $masked -replace '(BronzeBot2026|Hana@123456|Cloud@0905|India@123456)', '***'
            # show only lines containing User|Password|Destination|Client|Host|Hostname|sysid
            $masked.Split("`n") | Where-Object { $_ -match 'User|Password|Destination|Client|Host|SysID|sysid|env|name=' } | ForEach-Object { Write-Host $_.Trim() }
          } else { Write-Host "Web.config not found at $wc" }
          Write-Host ""
          Write-Host "=== RFC proxy smoke env=dev (control) ==="
          try {
            $r = Invoke-WebRequest 'http://localhost:9292/api/rfc/proxy?env=dev' -Method POST -Body '{"bapiname":"RFC_PING"}' -ContentType 'application/json' -Headers @{'X-RFC-Key'='v2-rfc-proxy-2026'} -UseBasicParsing -TimeoutSec 20
            Write-Host ("dev: " + $r.StatusCode + " body=" + $r.Content.Substring(0,[Math]::Min(300, $r.Content.Length)))
          } catch { Write-Host ("dev err: " + $_.Exception.Message) }
          Write-Host ""
          Write-Host "=== RFC proxy smoke env=qa ==="
          try {
            $r = Invoke-WebRequest 'http://localhost:9292/api/rfc/proxy?env=qa' -Method POST -Body '{"bapiname":"RFC_PING"}' -ContentType 'application/json' -Headers @{'X-RFC-Key'='v2-rfc-proxy-2026'} -UseBasicParsing -TimeoutSec 20
            Write-Host ("qa: " + $r.StatusCode + " body=" + $r.Content.Substring(0,[Math]::Min(300, $r.Content.Length)))
          } catch { Write-Host ("qa err: " + $_.Exception.Message) }
          Write-Host ""
          Write-Host "=== Read TADIR Z_IWFND* on QA via TABLE_READ direct ==="
          $body = '{"bapiname":"RFC_READ_TABLE","QUERY_TABLE":"TFDIR","DELIMITER":"|","OPTIONS":[{"TEXT":"FUNCNAME LIKE ''Z_IWFND%''"}],"FIELDS":[{"FIELDNAME":"FUNCNAME"}]}'
          try {
            $r = Invoke-WebRequest 'http://localhost:9292/api/rfc/proxy?env=qa' -Method POST -Body $body -ContentType 'application/json' -Headers @{'X-RFC-Key'='v2-rfc-proxy-2026'} -UseBasicParsing -TimeoutSec 30
            Write-Host ("qa TFDIR: " + $r.StatusCode + " body=" + $r.Content.Substring(0,[Math]::Min(500, $r.Content.Length)))
          } catch { Write-Host ("qa TFDIR err: " + $_.Exception.Message) }
          Write-Host ""
          Write-Host "=== Read USR02 sap_cloudai on QA (existence check) ==="
          $body2 = '{"bapiname":"RFC_READ_TABLE","QUERY_TABLE":"USR02","DELIMITER":"|","OPTIONS":[{"TEXT":"BNAME = ''SAP_CLOUDAI''"}],"FIELDS":[{"FIELDNAME":"BNAME"},{"FIELDNAME":"USTYP"},{"FIELDNAME":"GLTGV"}]}'
          try {
            $r = Invoke-WebRequest 'http://localhost:9292/api/rfc/proxy?env=qa' -Method POST -Body $body2 -ContentType 'application/json' -Headers @{'X-RFC-Key'='v2-rfc-proxy-2026'} -UseBasicParsing -TimeoutSec 30
            Write-Host ("qa USR02: " + $r.StatusCode + " body=" + $r.Content.Substring(0,[Math]::Min(500, $r.Content.Length)))
          } catch { Write-Host ("qa USR02 err: " + $_.Exception.Message) }
