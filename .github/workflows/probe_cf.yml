name: Probe cloudflared config on .36
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, iis]
    steps:
      - name: Find cloudflared config + service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== Service ==="
          Get-Service cloudflared -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "=== Process ==="
          Get-Process cloudflared -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "=== Common config paths ==="
          $paths = @(
            "C:\ProgramData\Cloudflare\cloudflared\config.yml",
            "C:\ProgramData\cloudflared\config.yml",
            "C:\Users\Administrator\.cloudflared\config.yml",
            "C:\Windows\System32\config\systemprofile\.cloudflared\config.yml",
            "C:\.cloudflared\config.yml"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "FOUND: $p"
              Write-Host "----- contents -----"
              Get-Content $p -Raw
              Write-Host "----- end -----"
            }
          }
          Write-Host "=== Search filesystem ==="
          Get-ChildItem -Path C:\ -Recurse -Filter "config.yml" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "cloudflared|cloudflare" } |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize
          Write-Host "=== Service binary ==="
          $svc = Get-WmiObject -Class Win32_Service -Filter "Name='cloudflared'" -ErrorAction SilentlyContinue
          if ($svc) { Write-Host "PathName: $($svc.PathName)" }
