name: OData -> BRONZE backfill (one service, N chunks, LAN-direct)

# Runs on the .36 self-hosted runner. Pulls SAP OData directly from the LAN
# (no Cloudflare worker hop) and bulk-INSERTs to Snowflake. Bypasses the
# CF 100s response cap + the universal-mcp tool's ~60s timeout that were
# limiting laptop-side backfills.
#
# Manual dispatch only. Choose any Z_SB_* service that's live on QA.

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'OData service e.g. Z_SB_MARA_FULL'
        required: true
        type: string
      entity:
        description: 'Entity set e.g. MaraFull'
        required: true
        type: string
      target_table:
        description: 'Snowflake target e.g. V2RETAIL.BRONZE.SAP_MARA_FULL_HIST_QA'
        required: true
        type: string
      date_field:
        description: 'OData date field for $filter (e.g. ersda, budat_mkpf)'
        required: true
        type: string
      start_date:
        description: 'YYYY-MM-DD'
        required: true
        type: string
      end_date:
        description: 'YYYY-MM-DD'
        required: true
        type: string
      window_days:
        description: 'Chunk size in days (7 for wide tables, 14 for narrow)'
        required: true
        default: '7'
        type: string
      env:
        description: 'qa or dev'
        required: true
        default: 'qa'
        type: string
      truncate:
        description: 'Truncate target before starting? true/false'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

concurrency:
  group: odata-bronze-backfill-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: [self-hosted, iis]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: powershell
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet snowflake-connector-python

      - name: Write direct-pull script
        shell: powershell
        run: |
          $py = @'
          """
          Direct SAP OData -> Snowflake BRONZE backfill.
          Runs on .36 LAN — talks to SAP at 192.168.144.179:8000 (QA) directly,
          no Cloudflare worker in between.
          """
          import os, sys, json, time, base64, socket, urllib.request, urllib.error
          from datetime import datetime, timedelta
          import snowflake.connector

          socket.setdefaulttimeout(600)   # 10min per request

          SERVICE      = os.environ['SERVICE']
          ENTITY       = os.environ['ENTITY']
          TARGET_TABLE = os.environ['TARGET_TABLE']
          DATE_FIELD   = os.environ['DATE_FIELD']
          START_DATE   = os.environ['START_DATE']
          END_DATE     = os.environ['END_DATE']
          WINDOW_DAYS  = int(os.environ['WINDOW_DAYS'])
          ENV          = os.environ['ODATA_ENV']
          TRUNCATE     = os.environ.get('TRUNCATE', 'false').lower() == 'true'

          # SAP OData endpoints (LAN-direct)
          if ENV == 'qa':
              SAP_HOST = 'http://192.168.144.179:8000'
              SAP_CLIENT = '600'
              SAP_USER = os.environ['SAP_QA_USER']
              SAP_PASS = os.environ['SAP_QA_PASS']
          else:
              SAP_HOST = 'http://192.168.144.174:8000'
              SAP_CLIENT = '210'
              SAP_USER = os.environ['SAP_DEV_USER']
              SAP_PASS = os.environ['SAP_DEV_PASS']

          # Snowflake
          SF_ACCOUNT = os.environ['SF_ACCOUNT']
          SF_USER    = os.environ['SF_USER']
          SF_PASS    = os.environ['SF_PASSWORD']

          BASE_URL = f"{SAP_HOST}/sap/opu/odata/sap/{SERVICE}/{ENTITY}?sap-client={SAP_CLIENT}&%24format=json"

          auth = base64.b64encode(f"{SAP_USER}:{SAP_PASS}".encode()).decode()
          HEADERS = {
              'Authorization': f'Basic {auth}',
              'Accept': 'application/json',
              'User-Agent': 'V2-OData-Backfill/1.0',
          }

          def date_ms_to_iso(s):
              """Convert /Date(1234567890000)/ to ISO timestamp or None."""
              if not s or not isinstance(s, str) or not s.startswith('/Date('):
                  return s
              try:
                  ms = int(s[6:-2].split('+')[0])
                  if ms > 253402214400000 - 1:   # year 9999 sentinel
                      return None
                  return datetime.utcfromtimestamp(ms / 1000).isoformat()
              except Exception:
                  return None

          def fetch_chunk(date_from, date_to, page_size=2000):
              flt = f"{DATE_FIELD} ge datetime'{date_from}T00:00:00' and {DATE_FIELD} lt datetime'{date_to}T00:00:00'"
              all_rows = []
              skip = 0
              while True:
                  url = f"{BASE_URL}&%24filter={urllib.parse.quote(flt)}&%24top={page_size}&%24skip={skip}"
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req, timeout=600) as r:
                      data = json.loads(r.read().decode('utf-8'))
                  rows = data.get('d', {}).get('results', [])
                  if not rows:
                      break
                  all_rows.extend(rows)
                  if len(rows) < page_size:
                      break
                  skip += page_size
              return all_rows

          def to_snowflake_rows(rows, columns):
              """Map OData rows to Snowflake column tuples."""
              import uuid
              batch_id = str(uuid.uuid4())
              ingested = datetime.utcnow().isoformat()
              source = f"{SERVICE}/{ENTITY}"
              out = []
              for r in rows:
                  tup = []
                  for col in columns:
                      v = r.get(col.lower())
                      if isinstance(v, str) and v.startswith('/Date('):
                          v = date_ms_to_iso(v)
                      tup.append(v)
                  tup += [ingested, source, batch_id, None]
                  out.append(tuple(tup))
              return out

          # Build chunk list
          chunks = []
          cur = datetime.strptime(START_DATE, '%Y-%m-%d')
          end = datetime.strptime(END_DATE,   '%Y-%m-%d')
          while cur <= end:
              nxt = cur + timedelta(days=WINDOW_DAYS)
              if nxt > end + timedelta(days=1):
                  nxt = end + timedelta(days=1)
              chunks.append((cur.strftime('%Y-%m-%d'), nxt.strftime('%Y-%m-%d')))
              cur = nxt

          print(f"=== {SERVICE}/{ENTITY} LAN-direct backfill ===", flush=True)
          print(f"=== {len(chunks)} chunks ({WINDOW_DAYS}d) {START_DATE} -> {END_DATE} ===", flush=True)
          print(f"=== Target: {TARGET_TABLE}   Env: {ENV} ===", flush=True)

          # Connect to Snowflake; get target columns
          sf = snowflake.connector.connect(account=SF_ACCOUNT, user=SF_USER,
                                            password=SF_PASS, database='V2RETAIL',
                                            schema='BRONZE', warehouse='COMPUTE_WH')
          cur_sf = sf.cursor()
          db, sch, tbl = TARGET_TABLE.split('.')
          cur_sf.execute(f"SELECT COLUMN_NAME FROM {db}.INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='{sch}' AND TABLE_NAME='{tbl}' ORDER BY ORDINAL_POSITION")
          all_cols = [r[0] for r in cur_sf.fetchall()]
          data_cols = [c for c in all_cols if c not in ('DL_INGESTED_AT','DL_SOURCE','DL_BATCH_ID','DL_DELTA_TOKEN')]
          print(f"=== Target has {len(all_cols)} cols ({len(data_cols)} data + 4 lineage) ===", flush=True)

          if TRUNCATE:
              cur_sf.execute(f"TRUNCATE TABLE {TARGET_TABLE}")
              print("  truncated.", flush=True)

          placeholders = ", ".join(["%s"] * len(all_cols))
          insert_sql = f"INSERT INTO {TARGET_TABLE} ({', '.join(all_cols)}) VALUES ({placeholders})"

          import urllib.parse
          total_ok = 0; total_fail = 0; total_rows = 0
          for i, (a, b) in enumerate(chunks):
              label = f"[{i+1:3}/{len(chunks)}] {a}..{b}"
              t0 = time.time()
              try:
                  rows = fetch_chunk(a, b)
                  if not rows:
                      print(f"{label}  OK   {time.time()-t0:5.1f}s  0 rows (empty window)", flush=True)
                      total_ok += 1
                      continue
                  sf_rows = to_snowflake_rows(rows, data_cols)
                  cur_sf.executemany(insert_sql, sf_rows)
                  sf.commit()
                  dt = time.time() - t0
                  total_rows += len(rows)
                  total_ok += 1
                  print(f"{label}  OK   {dt:5.1f}s  inserted={len(rows)}  total={total_rows}", flush=True)
              except Exception as e:
                  dt = time.time() - t0
                  total_fail += 1
                  print(f"{label}  FAIL {dt:5.1f}s  {type(e).__name__}: {str(e)[:200]}", flush=True)

          print(f"=== Done: OK={total_ok} FAIL={total_fail} TOTAL_ROWS={total_rows} ===", flush=True)
          cur_sf.close(); sf.close()
          '@
          Set-Content -Path direct_odata_backfill.py -Value $py -Encoding utf8

      - name: Run backfill
        shell: powershell
        env:
          SERVICE: ${{ inputs.service }}
          ENTITY: ${{ inputs.entity }}
          TARGET_TABLE: ${{ inputs.target_table }}
          DATE_FIELD: ${{ inputs.date_field }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          WINDOW_DAYS: ${{ inputs.window_days }}
          ODATA_ENV: ${{ inputs.env }}
          TRUNCATE: ${{ inputs.truncate }}
          SAP_DEV_USER: ${{ secrets.SAP_DEV_USER }}
          SAP_DEV_PASS: ${{ secrets.SAP_DEV_PASS }}
          SAP_QA_USER:  ${{ secrets.SAP_QA_USER }}
          SAP_QA_PASS:  ${{ secrets.SAP_QA_PASS }}
          SF_ACCOUNT:   ${{ secrets.SF_ACCOUNT }}
          SF_USER:      ${{ secrets.SF_USER }}
          SF_PASSWORD:  ${{ secrets.SF_PASSWORD }}
        run: python direct_odata_backfill.py
